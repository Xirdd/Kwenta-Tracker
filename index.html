<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom is locked so the PWA behaves like a native app: no double-tap zoom,
         no pinch zoom, and no iOS auto-zoom when an input is focused.
         viewport-fit=cover lets the layout extend under the notch; the app
         pads itself with env(safe-area-inset-*). The CSS side of this is in
         src/mobile.css, and src/mobileShell.js covers the iOS gesture events
         that the meta tag alone doesn't stop. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Kwenta — Budget Ledger</title>

    <!-- PWA / installability -->
    <meta name="theme-color" content="#0a1611" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Kwenta" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />

    <!-- Fraunces was loaded here but no stylesheet uses it (everything is
         Inter / IBM Plex Mono), so it was a wasted download on every first
         visit and an extra entry in the service worker's font cache. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Applies the saved theme before first paint. External on purpose: the
         Content-Security-Policy (vercel.json) blocks inline scripts. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- Splash screen: plain inline HTML/CSS (styled via style.css once it
         loads) so this paints immediately, before the JS bundle has even
         been fetched — main.js removes it once the first real screen is
         ready to show (see hideSplash() in src/main.js). -->
    <div id="splash" class="splash-screen">
      <div class="splash-glow"></div>
      <div class="splash-logo">₱</div>
      <div class="splash-title">Kwenta</div>
      <div class="splash-tagline">sulit sa bawat piso</div>
      <div class="splash-loader"><span></span><span></span><span></span></div>
    </div>

    <div class="app" id="app"></div>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
