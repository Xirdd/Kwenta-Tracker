<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Kwenta — Budget Ledger</title>

    <!-- PWA / installability -->
    <meta name="theme-color" content="#0a1611" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Kwenta" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme before first paint so there's no flash of the wrong colors.
      // The id list must match THEMES in src/theme.js. A saved id that's no
      // longer in it (e.g. the removed "light" theme) falls back to the default.
      (function () {
        try {
          var ids = ["forest", "deepsea", "plum", "wine", "amoled"];
          var stored = localStorage.getItem("kwenta_theme");
          var theme = ids.indexOf(stored) > -1 ? stored : "forest";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "forest");
        }
      })();
    </script>
  </head>
  <body>
    <!-- Splash screen: plain inline HTML/CSS (styled via style.css once it
         loads) so this paints immediately, before the JS bundle has even
         been fetched — main.js removes it once the first real screen is
         ready to show (see hideSplash() in src/main.js). -->
    <div id="splash" class="splash-screen">
      <div class="splash-glow"></div>
      <div class="splash-logo">₱</div>
      <div class="splash-title">Kwenta</div>
      <div class="splash-tagline">sulit sa bawat piso</div>
      <div class="splash-loader"><span></span><span></span><span></span></div>
    </div>

    <div class="app" id="app"></div>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
