<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Kwenta — Budget Ledger</title>

    <!-- PWA / installability -->
    <meta name="theme-color" content="#0e211b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Kwenta" />

    <!-- Updated App Icons -->
    <link rel="apple-touch-icon" href="/kwenta_icon_192.png" />
    <link rel="icon" type="image/png" href="/kwenta_icon_192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme before first paint so there's no flash of the wrong colors.
      (function () {
        try {
          var stored = localStorage.getItem("kwenta_theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Splash screen -->
    <div id="splash" class="splash-screen">
      <div class="splash-glow"></div>

      <!-- Replaced the plain ₱ text with the transparent background logo -->
      <div class="splash-logo">
        <img
          src="/kwenta_logo_nobg_512.png"
          alt="Kwenta Logo"
          style="width: 80px; height: 80px; object-fit: contain"
        />
      </div>

      <div class="splash-title">Kwenta</div>
      <div class="splash-tagline">sulit sa bawat piso</div>
      <div class="splash-loader"><span></span><span></span><span></span></div>
    </div>

    <div class="app" id="app"></div>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
