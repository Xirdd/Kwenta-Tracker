version: 2
updates:
  # Dependency updates arrive as pull requests, which run CI first. Minor and
  # patch updates are grouped into one weekly PR to keep the noise down.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
